<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUFYAN CALLING SYSTEM</title>
<style>
:root{--bg:#eef3f1;--card:#fff;--card2:#f4f8f6;--text:#0d1f1a;--mute:#5b6f68;--line:#d5e0dc;--em:#0b9d6a;--em2:#06754f;--chrome:linear-gradient(135deg,#f5f7f8,#b8c0c5 45%,#eef1f2 60%,#9aa3a8);--glow:rgba(11,157,106,.25);--shadow:0 8px 30px rgba(8,40,30,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060e0b;--card:#0e1a16;--card2:#132420;--text:#e8f1ee;--mute:#8aa39a;--line:#21352e;--em:#19c48a;--em2:#0b9d6a;--glow:rgba(25,196,138,.3);--shadow:0 8px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#060e0b;--card:#0e1a16;--card2:#132420;--text:#e8f1ee;--mute:#8aa39a;--line:#21352e;--em:#19c48a;--em2:#0b9d6a;--glow:rgba(25,196,138,.3);--shadow:0 8px 30px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 15% 0%,var(--glow),transparent 45%),radial-gradient(circle at 90% 100%,var(--glow),transparent 40%);background-attachment:fixed}
button,input{font:inherit;color:inherit}
.chrome-text{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.hidden{display:none!important}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.em{background:linear-gradient(135deg,var(--em),var(--em2));color:#fff;box-shadow:0 6px 20px var(--glow)}
.btn.ch{background:var(--chrome);color:#10221c;border:1px solid var(--line)}
.btn.gh{background:var(--card2);border:1px solid var(--line)}
.btn.danger{background:var(--card2);border:1px solid var(--line);color:#d64545}
.btn svg{width:18px;height:18px;flex:none}
input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;transition:border .2s,box-shadow .2s}
input:focus{border-color:var(--em);box-shadow:0 0 0 4px var(--glow)}
label{font-size:.8rem;color:var(--mute);font-weight:600;display:block;margin:12px 0 6px}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lcard{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:34px 28px;box-shadow:var(--shadow);text-align:center;animation:rise .7s cubic-bezier(.2,.8,.2,1)}
.lock{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--chrome);box-shadow:0 0 0 6px var(--glow),inset 0 0 12px rgba(0,0,0,.15);animation:pulse 3s infinite}
.lock svg{width:34px;height:34px;color:var(--em2)}
h1{margin:0;font-size:1.55rem;letter-spacing:.14em;font-weight:800}
.sub{color:var(--mute);font-size:.9rem;margin:6px 0 22px}
.err{color:#d64545;font-size:.85rem;min-height:1.2em;margin:10px 0}
.shake{animation:shake .4s}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pulse{50%{box-shadow:0 0 0 12px transparent,inset 0 0 12px rgba(0,0,0,.15)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* app */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.1em;font-size:1rem}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--em),var(--em2));display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px var(--glow)}
.logo svg{width:20px;height:20px}
main{max-width:1000px;margin:0 auto;padding:22px 16px 60px;animation:rise .5s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.8rem}.stat span{color:var(--mute);font-size:.8rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.bar .search{flex:1 1 220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:14px}html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}input{font-size:16px}.btn{min-height:44px;touch-action:manipulation}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);animation:rise .4s both;transition:transform .2s,border .2s}
.c:hover{transform:translateY(-3px);border-color:var(--em)}
.top{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;background:var(--chrome);display:grid;place-items:center;font-weight:800;color:var(--em2);flex:none}
.nm{font-weight:700;overflow-wrap:anywhere}.ph{color:var(--mute);font-size:.88rem;overflow-wrap:anywhere}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts .btn{padding:11px 8px;font-size:.85rem;text-decoration:none}.acts .full{grid-column:1/-1}
.mini{display:flex;gap:8px;margin-top:8px}.mini .btn{flex:1;padding:8px;font-size:.8rem}
.empty{text-align:center;color:var(--mute);padding:50px 10px;border:1px dashed var(--line);border-radius:18px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20;animation:fade .2s}
.modal{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow);animation:rise .3s;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:1.15rem}
.steps{margin:12px 0 0;padding-left:20px;line-height:1.7;font-size:.92rem}
.row{display:flex;gap:10px;margin-top:18px}.row .btn{flex:1}
.hint{font-size:.76rem;color:var(--mute);margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);border:1px solid var(--em);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:30;animation:rise .3s;max-width:90vw}
@keyframes fade{from{opacity:0}}
@media(max-width:600px){header{padding:10px 14px}main{padding:16px 12px 60px}.bar{gap:8px}.bar .search{flex:1 1 100%}.bar .btn{flex:1 1 calc(50% - 4px);padding:13px 10px}#addBtn{flex:1 1 100%}.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px}.stat b{font-size:1.5rem}.lcard{padding:28px 20px}h1{font-size:1.2rem;letter-spacing:.08em}.modal{padding:20px}.row{flex-direction:column-reverse}.acts .btn{font-size:.82rem}.brand{font-size:.85rem}.brand span{font-size:.8rem;letter-spacing:.06em}}@media(max-width:340px){.brand span{display:none}.acts{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}@media(min-width:900px){main{padding-top:32px}.c{padding:20px}}
</style>
</head>
<body>

<section id="login">
  <div class="lcard" id="lcard">
    <div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1 class="chrome-text">SUFYAN CALLING SYSTEM</h1>
    <p class="sub">Private dashboard. Enter your password to continue.</p>
    <form id="lform" autocomplete="off">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" aria-label="Password">
      <div class="err" id="lerr" role="alert"></div>
      <button class="btn em" style="width:100%" type="submit">Unlock Dashboard</button>
    </form>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></div><span class="chrome-text">SUFYAN CALLING SYSTEM</span></div>
    <button class="btn gh" id="lockBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Lock</button>
  </header>
  <main>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>Saved contacts</span></div>
      <div class="stat"><b id="sShown">0</b><span>Showing now</span></div>
    </div>
    <div class="bar">
      <input class="search" id="q" type="search" placeholder="Search by name or number" aria-label="Search contacts">
      <button class="btn em" id="addBtn">+ Add Contact</button>
      <button class="btn ch" id="impBtn">Import CSV</button>
      <button class="btn ch" id="expBtn">Export CSV</button>
      <input type="file" id="file" accept=".csv,text/csv" class="hidden">
    </div>
    <div class="grid" id="list"></div>
  </main>
</div>

<script>
(function(){
var PASS='sufiyan',KEY='scs_contacts_v1',SKEY='scs_unlocked';
var $=function(i){return document.getElementById(i)};
var contacts=[];
function load(){try{var r=localStorage.getItem(KEY);contacts=r?JSON.parse(r):[]}catch(e){contacts=[]}if(!Array.isArray(contacts))contacts=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(contacts))}catch(e){toast('Storage is unavailable; changes will not persist.')}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},3200)}
/* number: strip only formatting characters (spaces, dashes, brackets, dots, plus); digits are never changed */
function clean(p){var d=String(p).replace(/[\s\-().+]/g,'');return d}
function validate(p){var d=clean(p);if(!/^\d+$/.test(d))return {err:'Use digits only (spaces, dashes, brackets and + are fine).'};
  if(d.indexOf('00')===0)d=d.slice(2);
  if(d.charAt(0)==='0')return {err:'Include the country code instead of a leading 0 (e.g. 923001234567).'};
  if(d.length<8||d.length>15)return {err:'Number must be 8 to 15 digits including the country code.'};
  return {num:d}}
function init(n){return (n.trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('')||'?').toUpperCase()}
/* login */
function unlock(){$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}
function lock(){try{sessionStorage.removeItem(SKEY)}catch(e){}$('app').classList.add('hidden');$('login').classList.remove('hidden');$('pw').value='';$('lerr').textContent='';$('pw').focus()}
$('lform').addEventListener('submit',function(e){e.preventDefault();
  if($('pw').value===PASS){try{sessionStorage.setItem(SKEY,'1')}catch(x){}$('lerr').textContent='';unlock()}
  else{$('lerr').textContent='Incorrect password. Access denied.';var c=$('lcard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');$('pw').select()}});
$('lockBtn').onclick=lock;
/* render */
function render(){var q=$('q').value.trim().toLowerCase(),qd=q.replace(/[\s\-().+]/g,'');
  var f=contacts.filter(function(c){return !q||c.name.toLowerCase().indexOf(q)>-1||(qd&&c.phone.indexOf(qd)>-1)});
  $('sTotal').textContent=contacts.length;$('sShown').textContent=f.length;
  var L=$('list');
  if(!f.length){L.innerHTML='<div class="empty" style="grid-column:1/-1">'+(contacts.length?'No contacts match your search.':'No contacts yet. Add your first contact or import a CSV.')+'</div>';return}
  L.innerHTML=f.map(function(c,i){return '<div class="c" style="animation-delay:'+Math.min(i,12)*30+'ms"><div class="top"><div class="av">'+esc(init(c.name))+'</div><div><div class="nm">'+esc(c.name)+'</div><div class="ph">+'+esc(c.phone)+'</div></div></div>'+
   '<div class="acts"><a class="btn em" href="https://wa.me/'+esc(c.phone)+'" target="_blank" rel="noopener noreferrer">WhatsApp Chat</a><button class="btn ch" data-call="'+c.id+'">WhatsApp Voice Call</button><a class="btn em full" style="background:linear-gradient(135deg,#f5f7f8,#9aa3a8);color:#10221c;box-shadow:none" href="tel:+'+esc(c.phone)+'">Phone Call (direct)</a></div>'+
   '<div class="mini"><button class="btn gh" data-edit="'+c.id+'">Edit</button><button class="btn danger" data-del="'+c.id+'">Delete</button></div></div>'}).join('')}
$('q').addEventListener('input',render);
$('list').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  var id=b.dataset.call||b.dataset.edit||b.dataset.del;var c=contacts.find(function(x){return x.id===id});if(!c)return;
  if(b.dataset.call)call(c);else if(b.dataset.edit)form(c);else if(confirm('Delete '+c.name+'?')){contacts=contacts.filter(function(x){return x.id!==id});save();render();toast('Contact deleted')}});
/* modal helpers */
function modal(html){var o=document.createElement('div');o.className='ov';o.innerHTML='<div class="modal">'+html+'</div>';
  o.addEventListener('click',function(e){if(e.target===o)o.remove()});document.body.appendChild(o);return o}
function form(c){var o=modal('<h2>'+(c?'Edit Contact':'Add Contact')+'</h2><form id="cf"><label>Name</label><input id="fn" required maxlength="80" value="'+(c?esc(c.name):'')+'"><label>WhatsApp number (with country code)</label><input id="fp" inputmode="tel" required placeholder="923001234567" value="'+(c?esc(c.phone):'')+'"><div class="hint">Example: 92 300 1234567. Spaces, dashes, brackets and + are removed automatically; your digits are never changed.</div><div class="err" id="fe"></div><div class="row"><button type="button" class="btn gh" id="fc">Cancel</button><button class="btn em">Save</button></div></form>');
  o.querySelector('#fn').focus();o.querySelector('#fc').onclick=function(){o.remove()};
  o.querySelector('#cf').addEventListener('submit',function(e){e.preventDefault();
    var n=o.querySelector('#fn').value.trim(),v=validate(o.querySelector('#fp').value);
    if(!n){o.querySelector('#fe').textContent='Enter a name.';return}
    if(v.err){o.querySelector('#fe').textContent=v.err;return}
    if(contacts.some(function(x){return x.phone===v.num&&(!c||x.id!==c.id)})&&!confirm('This number is already saved. Save anyway?'))return;
    if(c){c.name=n;c.phone=v.num}else contacts.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:n,phone:v.num});
    save();render();o.remove();toast(c?'Contact updated':'Contact saved')})}
$('addBtn').onclick=function(){form(null)};
/* voice call */
function call(c){window.open('https://wa.me/'+c.phone,'_blank','noopener');toast('Chat is opening. Tap the phone icon in WhatsApp to call.');return;
  var o=modal('<h2>Start a WhatsApp voice call</h2><div class="ph">'+esc(c.name)+' · +'+esc(c.phone)+'</div><ol class="steps"><li>Their WhatsApp chat is opening in a new tab or in the WhatsApp app.</li><li>Open the chat if it asks you to continue.</li><li>Press the <b>voice-call (phone) icon</b> at the top of the WhatsApp chat to start the call.</li></ol><div class="hint">WhatsApp does not allow websites to start calls automatically, so the final tap must be done inside WhatsApp.</div><div class="row"><a class="btn em" style="text-decoration:none" href="https://wa.me/'+esc(c.phone)+'" target="_blank" rel="noopener noreferrer">Open chat again</a><button class="btn gh" id="cc">Close</button></div>');
  o.querySelector('#cc').onclick=function(){o.remove()}}
/* CSV */
function parseCSV(t){var rows=[],r=[],f='',q=false;t=t.replace(/^\uFEFF/,'');
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===','||ch===';'){r.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(function(x){return x.trim()}))rows.push(r);r=[]}
    else f+=ch}
  r.push(f);if(r.some(function(x){return x.trim()}))rows.push(r);return rows}
$('impBtn').onclick=function(){$('file').click()};
$('file').addEventListener('change',function(){var fl=this.files[0];if(!fl)return;var rd=new FileReader();
  rd.onload=function(){var rows=parseCSV(String(rd.result)),ni=0,pi=1;
    if(rows.length&&/name|phone|number|whatsapp/i.test(rows[0].join(','))){var h=rows.shift().map(function(x){return x.trim().toLowerCase()});
      var a=h.findIndex(function(x){return x.indexOf('name')>-1}),b=h.findIndex(function(x){return /phone|number|whatsapp|mobile/.test(x)});if(a>-1)ni=a;if(b>-1)pi=b}
    var add=0,skip=0;rows.forEach(function(r){var n=(r[ni]||'').trim(),v=validate(r[pi]||'');
      if(!n||v.err||contacts.some(function(x){return x.phone===v.num})){skip++;return}
      contacts.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7)+add,name:n,phone:v.num});add++});
    save();render();toast('Imported '+add+' contact(s)'+(skip?', skipped '+skip+' invalid or duplicate':''))};
  rd.readAsText(fl);this.value=''});
$('expBtn').onclick=function(){if(!contacts.length){toast('No contacts to export');return}
  var q=function(s){return '"'+String(s).replace(/"/g,'""')+'"'};
  var csv='Name,Phone\n'+contacts.map(function(c){return q(c.name)+','+q(c.phone)}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='sufyan-contacts.csv';document.body.appendChild(a);a.click();a.remove();
  toast('If the download is blocked here, open the app in its own tab and try again.')};
/* start */
load();
try{if(sessionStorage.getItem(SKEY)==='1')unlock();else $('pw').focus()}catch(e){}
})();
</script>
</body>
</html>
